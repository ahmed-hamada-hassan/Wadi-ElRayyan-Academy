<article class="course-card" [class.featured]="course().isFeatured">
  <!-- 16:9 Thumbnail -->
  <div class="card-media" (click)="onOpenDetails()">
    <img
      [src]="course().imageUrl"
      [alt]="course().imageAlt"
      class="card-img"
      loading="lazy"
    />

    <span class="cat-badge" [attr.data-color]="course().categoryColor ?? 'navy'">
        {{ course().categoryLabel }}
    </span>

    @if (course().badgeText) {
      <span class="promo-badge">{{ course().badgeText }}</span>
    }
  </div>

  <!-- Body -->
  <div class="card-body">
    <div class="card-text">
      <h3 class="card-title line-clamp-2" (click)="onOpenDetails()">
        {{ course().title | bidiIsolate }}
      </h3>
      <p class="card-excerpt line-clamp-3">
        {{ course().fullDescription | bidiIsolate }}
      </p>
    </div>

    <div class="card-footer-wrap">
      <!-- Metadata Row -->
      <div class="card-meta">
        <span class="meta-item">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="12" cy="12" r="10"/>
            <polyline points="12 6 12 12 16 14"/>
          </svg>
          <span>{{ course().hoursLabel }}</span>
        </span>

        <span class="meta-item">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="12" cy="12" r="10"/>
            <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/>
          </svg>
          <span>{{ course().deliveryMode }}</span>
        </span>
      </div>

      <!-- Dual Action Bar -->
      <div class="card-actions">
        <button type="button" class="btn-details" (click)="onOpenDetails()">
          اعرف تفاصيل أكتر
        </button>

        <a
          [href]="coursesService.getWhatsAppUrl(course())"
          target="_blank"
          rel="noopener noreferrer"
          class="btn-wa-icon"
          [attr.aria-label]="'استفسار واتساب عن ' + course().title"
          title="حجز واستفسار واتساب"
        >
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M20.52 3.48A11.86 11.86 0 0 0 12.06 0C5.5 0 .16 5.34.16 11.9c0 2.1.55 4.15 1.6 5.96L0 24l6.33-1.66a11.84 11.84 0 0 0 5.73 1.46h.01c6.56 0 11.9-5.34 11.9-11.9 0-3.18-1.24-6.17-3.45-8.42ZM12.07 21.8h-.01a9.87 9.87 0 0 1-5.03-1.38l-.36-.21-3.76.99 1-3.66-.24-.38a9.84 9.84 0 0 1-1.51-5.26c0-5.45 4.44-9.89 9.9-9.89 2.64 0 5.13 1.03 7 2.9a9.82 9.82 0 0 1 2.9 7c0 5.46-4.44 9.89-9.89 9.89Zm5.43-7.41c-.3-.15-1.76-.87-2.03-.97-.27-.1-.47-.15-.67.15-.2.3-.77.97-.94 1.17-.17.2-.35.22-.65.07-.3-.15-1.26-.46-2.4-1.48-.89-.79-1.48-1.77-1.66-2.07-.17-.3-.02-.46.13-.61.13-.13.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.02-.52-.08-.15-.67-1.61-.92-2.2-.24-.58-.49-.5-.67-.51h-.57c-.2 0-.52.07-.79.37-.27.3-1.04 1.02-1.04 2.48s1.07 2.88 1.22 3.08c.15.2 2.1 3.2 5.08 4.49.71.31 1.26.49 1.69.63.71.23 1.36.2 1.87.12.57-.09 1.76-.72 2.01-1.41.25-.7.25-1.29.17-1.41-.07-.12-.27-.2-.57-.35Z"/>
          </svg>
        </a>
      </div>
    </div>
  </div>
</article>
