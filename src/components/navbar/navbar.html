<header class="navbar">
  <div class="container navbar-inner">
    <!-- Brand -->
    <a routerLink="/" class="brand">
      <img
        src="/wadi-elrayyan-academy.jpg"
        [alt]="settings().academyName"
        class="brand-logo"
        width="42"
        height="42"
      />
      <div class="brand-text">
        <span class="brand-name">{{ settings().academyName }}</span>
        <span class="brand-sub">{{ settings().academySubTitle }}</span>
      </div>
    </a>

    <!-- Navigation Links -->
    <nav class="nav-links" aria-label="التنقل الرئيسي">
      <a
        routerLink="/"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        class="nav-link"
      >
        الرئيسية
      </a>
      <a
        routerLink="/courses"
        routerLinkActive="active"
        class="nav-link"
      >
        الكورسات المتاحة
      </a>
    </nav>

    <!-- Actions: Theme Toggle + WhatsApp -->
    <div class="nav-actions">
      <button
        type="button"
        class="theme-btn"
        (click)="themeService.toggleTheme()"
        [attr.aria-label]="themeService.theme() === 'dark' ? 'التبديل للوضع النهاري' : 'التبديل للوضع الليلي'"
        [title]="themeService.theme() === 'dark' ? 'الوضع النهاري' : 'الوضع الليلي'"
      >
        @if (themeService.theme() === 'dark') {
          <!-- Sun Icon -->
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
          </svg>
        } @else {
          <!-- Moon Icon -->
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
          </svg>
        }
      </button>

      <a
        [href]="coursesService.getWhatsAppUrl()"
        target="_blank"
        rel="noopener noreferrer"
        class="wa-btn"
      >
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M20.52 3.48A11.86 11.86 0 0 0 12.06 0C5.5 0 .16 5.34.16 11.9c0 2.1.55 4.15 1.6 5.96L0 24l6.33-1.66a11.84 11.84 0 0 0 5.73 1.46h.01c6.56 0 11.9-5.34 11.9-11.9 0-3.18-1.24-6.17-3.45-8.42ZM12.07 21.8h-.01a9.87 9.87 0 0 1-5.03-1.38l-.36-.21-3.76.99 1-3.66-.24-.38a9.84 9.84 0 0 1-1.51-5.26c0-5.45 4.44-9.89 9.9-9.89 2.64 0 5.13 1.03 7 2.9a9.82 9.82 0 0 1 2.9 7c0 5.46-4.44 9.89-9.89 9.89Zm5.43-7.41c-.3-.15-1.76-.87-2.03-.97-.27-.1-.47-.15-.67.15-.2.3-.77.97-.94 1.17-.17.2-.35.22-.65.07-.3-.15-1.26-.46-2.4-1.48-.89-.79-1.48-1.77-1.66-2.07-.17-.3-.02-.46.13-.61.13-.13.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.02-.52-.08-.15-.67-1.61-.92-2.2-.24-.58-.49-.5-.67-.51h-.57c-.2 0-.52.07-.79.37-.27.3-1.04 1.02-1.04 2.48s1.07 2.88 1.22 3.08c.15.2 2.1 3.2 5.08 4.49.71.31 1.26.49 1.69.63.71.23 1.36.2 1.87.12.57-.09 1.76-.72 2.01-1.41.25-.7.25-1.29.17-1.41-.07-.12-.27-.2-.57-.35Z"/>
        </svg>
        <span class="wa-label">تواصل واتساب</span>
      </a>
    </div>
  </div>
</header>

<!-- Fixed Bottom Navigation Bar (mobile only) -->
<nav class="bottom-nav" aria-label="التنقل السفلي">
  <a
    routerLink="/"
    routerLinkActive="bottom-nav-active"
    [routerLinkActiveOptions]="{ exact: true }"
    class="bottom-nav-item"
  >
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
      <polyline points="9 22 9 12 15 12 15 22"/>
    </svg>
    <span>الرئيسية</span>
  </a>
  <a
    routerLink="/courses"
    routerLinkActive="bottom-nav-active"
    class="bottom-nav-item"
  >
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="3" y="3" width="7" height="7"/>
      <rect x="14" y="3" width="7" height="7"/>
      <rect x="14" y="14" width="7" height="7"/>
      <rect x="3" y="14" width="7" height="7"/>
    </svg>
    <span>الدورات</span>
  </a>
</nav>
